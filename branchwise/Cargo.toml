[package]
name = "branchwise"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
wg = { git = "https://github.com/wasmga-me/wasmgame-wg" }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
# keep the name section, so a crash names its functions
strip = "debuginfo"

[features]
# exports bw_check, which plays every lesson's solution (tools/check.mjs)
selfcheck = []
