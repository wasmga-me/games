[package]
name = "partial-combat"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
wg = { git = "https://github.com/wasmga-me/wasmgame-wg", branch = "claude/project-thread-x2myc2" }

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
# keep the name section, so a crash names its functions
strip = "debuginfo"
