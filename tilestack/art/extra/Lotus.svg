<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="300" height="400" viewBox="0 0 300 400">
  <!-- a lotus: open petals over a pad -->
  <defs>
    <path id="pet" d="M0 0 C -30 -30, -30 -90, 0 -130 C 30 -90, 30 -30, 0 0 Z" stroke="#000037" stroke-width="5" stroke-linejoin="round"/>
  </defs>
  <path d="M150 390 L150 250" stroke="#000037" stroke-width="14" stroke-linecap="round"/>
  <path d="M150 390 L150 250" stroke="#2f7d2f" stroke-width="6" stroke-linecap="round"/>
  <path d="M14 332 C 24 286, 106 276, 150 298 C 194 276, 276 286, 286 332 C 252 378, 48 378, 14 332 Z" fill="#004900" stroke="#000037" stroke-width="5" stroke-linejoin="round"/>
  <path d="M150 300 L150 352 M150 300 L90 342 M150 300 L210 342 M150 300 L44 322 M150 300 L256 322" stroke="#2f7d2f" stroke-width="4"/>
  <g transform="translate(150 262) scale(1.3)">
